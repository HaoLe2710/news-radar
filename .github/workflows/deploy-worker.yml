name: News Radar Worker CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Worker tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test edition builder
        run: node --experimental-strip-types --test test/*.node.test.mjs
      - name: Type check Worker
        run: npx tsc --noEmit
      - name: Build Worker (no deployment)
        run: npx wrangler deploy --dry-run --outdir ./dist-check

  deploy:
    name: Migrate D1 and deploy Worker
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: news-radar-worker-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test public API
        env:
          WORKER_URL: https://new-radar-api.lengochao123-27102004.workers.dev
        run: |
          node --input-type=module -e '
            const base = process.env.WORKER_URL;
            for (const route of ["/api/health", "/api/editions/latest", "/api/editions/archive", "/api/magazines/latest", "/api/magazines/archive", "/api/push/config"]) {
              let success = false;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  const response = await fetch(base + route, { signal: AbortSignal.timeout(10000) });
                  if (!response.ok) throw new Error("HTTP " + response.status);
                  const data = await response.json();
                  if (route.endsWith("/latest") && !["pending", "ready"].includes(data.status))
                    throw new Error("Unexpected edition response");
                  if (route.endsWith("/archive") && !Array.isArray(data.data))
                    throw new Error("Unexpected edition archive response");
                  if (route.endsWith("/push/config") && typeof data.enabled !== "boolean")
                    throw new Error("Unexpected Web Push configuration response");
                  if (route.endsWith("/health") && data.status !== "ok")
                    throw new Error("Unexpected health response");
                  console.log(route + ": " + data.status);
                  success = true;
                  break;
                } catch (error) {
                  console.error(route + " attempt " + attempt + ": " + error.message);
                  if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              if (!success) process.exitCode = 1;
            }
          '
