name: Deploy News Radar Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-radar-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test edition builder
        run: node --experimental-strip-types --test test/editions.node.test.mjs

      - name: Type check Worker
        run: npx tsc --noEmit

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed edition endpoint
        env:
          WORKER_URL: https://new-radar-api.lengochao123-27102004.workers.dev
        run: |
          node --input-type=module -e '
            const base = process.env.WORKER_URL;
            for (const route of ["/api/health", "/api/editions/latest"]) {
              let success = false;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  const response = await fetch(base + route, { signal: AbortSignal.timeout(10000) });
                  if (!response.ok) throw new Error("HTTP " + response.status);
                  const data = await response.json();
                  if (route.endsWith("/latest") && !["pending", "ready"].includes(data.status)) {
                    throw new Error("Invalid edition response");
                  }
                  if (route.endsWith("/health") && data.status !== "ok") {
                    throw new Error("Invalid health response");
                  }
                  console.log(route + ":", data.status);
                  success = true;
                  break;
                } catch (error) {
                  console.error(route + " attempt " + attempt + ":", error.message);
                  if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              if (!success) process.exitCode = 1;
            }
          '
