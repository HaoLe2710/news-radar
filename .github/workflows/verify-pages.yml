name: News Radar Pages Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/verify-pages.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: Verify live Cloudflare Pages PWA
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Poll deployed PWA shell
        env:
          SITE: https://news-radar-9px.pages.dev
          API: https://new-radar-api.lengochao123-27102004.workers.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "Checking Production Pages, attempt $i..."
            if curl -fLsS --max-time 12 "$SITE/manifest.webmanifest" -o /tmp/manifest.json \
              && grep -q '"name": "News Radar Pocket' /tmp/manifest.json \
              && grep -q '/icon-192.png' /tmp/manifest.json \
              && curl -fLsS --max-time 12 "$SITE/library/" -o /tmp/library.html \
              && curl -fLsS --max-time 12 "$SITE/sw.js" -o /tmp/sw.js \
              && grep -q "nr-shell-v15" /tmp/sw.js \
              && grep -q "notificationclick" /tmp/sw.js \
              && curl -fLsS --max-time 12 "$SITE/notifications/" -o /tmp/notifications.html \
              && curl -fLsS --max-time 12 "$API/api/push/config" -o /tmp/push.json \
              && grep -q '"enabled":true' /tmp/push.json; then
              echo "Phase 15 PWA and Phase 16 live Web Push (VAPID enabled) verified."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Production is not serving activated Phase 16 Web Push with VAPID keys."
          exit 1

      - name: Verify Phase 18 newspaper navigation and reader routes
        if: github.event_name == 'push'
        env:
          SITE: https://news-radar-9px.pages.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "Checking Phase 18 production UI, attempt $i..."
            if curl -fLsS --max-time 12 -H 'Cache-Control: no-cache' "$SITE/" -o /tmp/nr-home-18.html \
              && grep -q 'nr-global-header' /tmp/nr-home-18.html \
              && grep -q 'nr-global-navigation' /tmp/nr-home-18.html \
              && grep -q 'Những câu chuyện đáng chú ý' /tmp/nr-home-18.html \
              && curl -fLsS --max-time 12 "$SITE/edition/" -o /tmp/nr-daily-18.html \
              && grep -q 'nr-reader-shell' /tmp/nr-daily-18.html \
              && curl -fLsS --max-time 12 "$SITE/magazine/" -o /tmp/nr-weekly-18.html \
              && grep -q 'wm-app' /tmp/nr-weekly-18.html; then
              echo "Phase 18 global navigation and newspaper reader pages are served in Production."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Phase 18 UI is not deployed on Cloudflare Pages."
          exit 1

      - name: Verify Vietnamese font assets on Cloudflare Pages
        if: github.event_name == 'push'
        env:
          SITE: https://news-radar-9px.pages.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "Checking self-hosted font assets, attempt $i..."
            if curl -fLsS --max-time 12 -H 'Cache-Control: no-cache' "$SITE/" -o /tmp/nr-font-home.html; then
              path=$(grep -oE '/_next/static/media/[^"]+\.woff2' /tmp/nr-font-home.html | head -n 1 || true)
              if [ -n "$path" ] && ! grep -q 'fonts.googleapis.com' /tmp/nr-font-home.html \
                && curl -fLsS --max-time 12 "$SITE$path" -o /tmp/nr-font-live.woff2 \
                && [ "$(wc -c </tmp/nr-font-live.woff2)" -gt 1000 ]; then
                echo "Verified bundled font preloading and live woff2 delivery."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Vietnamese font bundle is not yet being served in Production."
          exit 1

      - name: Verify restored News Radar logo and localized world-news API
        if: github.event_name == 'push'
        env:
          SITE: https://news-radar-9px.pages.dev
          API: https://new-radar-api.lengochao123-27102004.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const site=process.env.SITE,api=process.env.API;
          let verified=false;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const [page,news,logo]=await Promise.all([
                fetch(site+"/",{cache:"no-store",signal:AbortSignal.timeout(10000)}),
                fetch(api+"/api/news?region=world&pageSize=1",{cache:"no-store",signal:AbortSignal.timeout(10000)}),
                fetch(site+"/icon.svg",{signal:AbortSignal.timeout(10000)})
              ]);
              if(!page.ok||!news.ok||!logo.ok)throw Error("Pages or world-news endpoint not reachable");
              const html=await page.text();
              if(!html.includes('nr-global-brand-logo')||!html.includes('/icon.svg'))throw Error("Restored News Radar logo not rendered in site navigation");
              const body=await news.json();
              if(!Array.isArray(body.data))throw Error("World-news API must return data array");
              if(body.data.length){
                const article=body.data[0];
                if(!Object.hasOwn(article,"titleVi")||!Object.hasOwn(article,"summaryVi"))
                  throw Error("Localization columns not visible in live world-news API");
                if(typeof article.title!=="string"||typeof article.url!=="string")
                  throw Error("Original English RSS fields must remain available");
              }
              console.log("Production verified: original News Radar emblem, world-news API and bilingual fields; translated entries may populate on hourly cron.");
              verified=true;break;
            }catch(error){
              console.log("Attempt "+attempt+": "+error.message);
              if(attempt<20)await new Promise(resolve=>setTimeout(resolve,15000));
            }
          }
          if(!verified)process.exitCode=1;
          NODE
