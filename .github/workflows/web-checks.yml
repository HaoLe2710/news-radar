name: News Radar Web Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-checks.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-checks.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test web features
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Build static site
        run: npm run build
      - name: Verify Vietnamese fonts are self-hosted
        run: |
          set -euo pipefail
          fonts=$(find out/_next/static/media -type f -name '*.woff2' | wc -l)
          test "$fonts" -ge 2
          if grep -q 'fonts.googleapis.com' out/index.html; then
            echo "::error::Runtime Google Fonts dependency remains in exported HTML"
            exit 1
          fi
          echo "Verified $fonts bundled font files; no external Google Fonts stylesheet."

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test edition composition
        run: node --experimental-strip-types --test test/*.node.test.mjs
      - name: Check Worker TypeScript
        run: npx tsc --noEmit
      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir ./dist-check
